name: 🔧 Build

on:
  push:
    paths-ignore:
      - 'web/**'
      - '**.md'
      - '**.txt'
      - '**.pdf'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - 'app/src/test/**'
  workflow_dispatch:

jobs:
  build:
    name: 🔨 Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      short_sha: ${{ steps.set_sha.outputs.short_sha }}
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: 🔑 Create google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "::error title=Secret::GOOGLE_SERVICES_JSON is empty or not configured"
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          python3 -c "import json; json.load(open('app/google-services.json'))" \
            || { echo "::error title=JSON::google-services.json is not valid JSON"; exit 1; }
          echo "✅ google-services.json created"

      - name: 📝 Write secrets to local.properties
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_SYNAPSE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_SYNAPSE_ANON_KEY }}
          SUPABASE_SYNAPSE_S3_ENDPOINT_URL: ${{ secrets.SUPABASE_SYNAPSE_S3_ENDPOINT_URL }}
          SUPABASE_SYNAPSE_S3_ENDPOINT_REGION: ${{ secrets.SUPABASE_SYNAPSE_S3_ENDPOINT_REGION }}
          SUPABASE_SYNAPSE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_SYNAPSE_S3_ACCESS_KEY_ID }}
          SUPABASE_SYNAPSE_S3_ACCESS_KEY: ${{ secrets.SUPABASE_SYNAPSE_S3_ACCESS_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_SECRET: ${{ secrets.GOOGLE_WEB_CLIENT_SECRET }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
        run: |
          set -euo pipefail
          : > local.properties
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "SUPABASE_SYNAPSE_S3_ENDPOINT_URL=$SUPABASE_SYNAPSE_S3_ENDPOINT_URL"
            echo "SUPABASE_SYNAPSE_S3_ENDPOINT_REGION=$SUPABASE_SYNAPSE_S3_ENDPOINT_REGION"
            echo "SUPABASE_SYNAPSE_S3_ACCESS_KEY_ID=$SUPABASE_SYNAPSE_S3_ACCESS_KEY_ID"
            echo "SUPABASE_SYNAPSE_S3_ACCESS_KEY=$SUPABASE_SYNAPSE_S3_ACCESS_KEY"
            echo "GEMINI_API_KEY=$GEMINI_API_KEY"
            echo "SENTRY_DSN=$SENTRY_DSN"
            echo "IMGBB_API_KEY=$IMGBB_API_KEY"
            echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID"
            echo "GOOGLE_WEB_CLIENT_SECRET=$GOOGLE_WEB_CLIENT_SECRET"
            echo "ONESIGNAL_APP_ID=$ONESIGNAL_APP_ID"
          } >> local.properties
          echo "✅ local.properties updated"

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 🏗️ Build Release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_SYNAPSE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_SYNAPSE_ANON_KEY }}
          SUPABASE_SYNAPSE_S3_ENDPOINT_URL: ${{ secrets.SUPABASE_SYNAPSE_S3_ENDPOINT_URL }}
          SUPABASE_SYNAPSE_S3_ENDPOINT_REGION: ${{ secrets.SUPABASE_SYNAPSE_S3_ENDPOINT_REGION }}
          SUPABASE_SYNAPSE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_SYNAPSE_S3_ACCESS_KEY_ID }}
          SUPABASE_SYNAPSE_S3_ACCESS_KEY: ${{ secrets.SUPABASE_SYNAPSE_S3_ACCESS_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_SECRET: ${{ secrets.GOOGLE_WEB_CLIENT_SECRET }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          GRADLE_OPTS: "-Xmx6g -Dorg.gradle.jvmargs='-Xmx6g -XX:MaxMetaspaceSize=1g'"
        run: |
          set +e
          ./gradlew assembleRelease --no-daemon --console=plain 2>&1 | tee "$RUNNER_TEMP/assembleRelease.log"
          gradle_status=${PIPESTATUS[0]}
          set -e
          if [ "$gradle_status" -ne 0 ]; then
            diagnostics=$(grep -E '(^e: |^FAILURE:|^\* What went wrong:|^Execution failed for task|^Task .*not found|UnknownTaskException|^> Task .* FAILED|^.* FAILED$|^.*AssertionError:)' "$RUNNER_TEMP/assembleRelease.log" | tail -n 25 || true)
            if [ -z "$diagnostics" ]; then
              diagnostics=$(awk 'BEGIN { remaining = 0 } /^\* What went wrong:/ { remaining = 12 } remaining > 0 { print; remaining-- }' "$RUNNER_TEMP/assembleRelease.log")
            fi
            if [ -z "$diagnostics" ]; then
              diagnostics=$(tail -n 12 "$RUNNER_TEMP/assembleRelease.log")
            fi
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=Android release-build diagnostics::${line}"
            done <<< "$diagnostics"
          fi
          exit "$gradle_status"

      - name: 🔖 Set short SHA
        id: set_sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: ✏️ Rename APK with commit hash
        run: |
          set -euo pipefail
          APK_DIR=app/build/outputs/apk/release
          SRC=$(find "$APK_DIR" -maxdepth 1 -name "*.apk" | head -n1)
          if [ -z "$SRC" ]; then
            echo "::error title=APK::No APK found in $APK_DIR"
            ls -la "$APK_DIR" || true
            exit 1
          fi
          DEST="$APK_DIR/app-release-${{ steps.set_sha.outputs.short_sha }}.apk"
          mv "$SRC" "$DEST"
          echo "✅ Renamed to $DEST"

      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-release-${{ steps.set_sha.outputs.short_sha }}
          path: app/build/outputs/apk/release/app-release-${{ steps.set_sha.outputs.short_sha }}.apk
          if-no-files-found: error

  aggregateAndSend:
    name: 📣 Send APKs to Telegram
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v4

      - name: 📥 Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: apk-release-${{ needs.build.outputs.short_sha }}
          path: ./downloaded-artifact

      - name: 🐍 Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 📦 Install Dependencies
        run: pip install --no-cache-dir telethon

      - name: 📝 Get Git Commit Info
        run: |
          echo "COMMIT_AUTHOR=$(git log -1 --pretty=format:'%an')" >> $GITHUB_ENV
          echo "COMMIT_MESSAGE=$(git log -1 --pretty=format:'%s')" >> $GITHUB_ENV

      - name: 💾 Restore Telegram session cache
        uses: actions/cache@v4
        id: telegram_session_cache
        with:
          path: bot_session.session
          key: telegram-session-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            telegram-session-${{ runner.os }}-

      - name: 📨 Send APKs to Telegram
        id: telegram
        continue-on-error: true
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
          APK_PATH: ./downloaded-artifact/app-release-${{ needs.build.outputs.short_sha }}.apk
          GITHUB_ACTOR: ${{ github.actor }}
        run: python ./.github/workflows/deploy_artifacts.py

      - name: ⚠️ Warn if Telegram failed
        if: steps.telegram.outcome == 'failure'
        run: echo "::warning title=Telegram::Failed to send APK to Telegram (see step logs)"
