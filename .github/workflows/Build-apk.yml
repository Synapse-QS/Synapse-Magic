name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # ✅ مهلة زمنية لتجنب بقاء المهمة عالقة في الطابور
    timeout-minutes: 30

    # إذا كانت الأسرار Environment secrets، فعّل السطر التالي
    # environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ✅ حقن الأسرار في local.properties قبل البناء
      - name: Inject secrets into local.properties
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "::error title=Secret::SUPABASE_URL is empty or not configured"
            exit 1
          fi
          if [ -z "${GOOGLE_WEB_CLIENT_ID:-}" ]; then
            echo "::error title=Secret::GOOGLE_WEB_CLIENT_ID is empty or not configured"
            exit 1
          fi
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID"
          } >> local.properties
          echo "✅ local.properties updated (values hidden)"

      # ✅ البناء مع تمرير الأسرار كمتغيرات بيئة (احتياطي)
      - name: Build release
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: ./gradlew assembleRelease --no-daemon

      # ✅ التحقق النهائي من BuildConfig.java
      - name: Verify BuildConfig values
        run: |
          set -euo pipefail
          build_config=app/build/generated/source/buildConfig/release/com/synapse/social/studioasinc/BuildConfig.java

          if [ ! -f "$build_config" ]; then
            echo "::error title=BuildConfig::missing $build_config"
            exit 1
          fi

          fail=0

          expect() {
            field=$1
            want=$2
            got=$(grep -oP "(?<=String $field = \")[^\"]*" "$build_config" || true)
            if [ "$got" != "$want" ]; then
              echo "::error title=BuildConfig::$field resolved to '$got', expected '$want' — check the org secret"
              fail=1
            else
              echo "✅ $field OK"
            fi
          }

          expect SUPABASE_URL "https://apqvyyphlrtmuyjnzmuq.supabase.co"
          expect GOOGLE_WEB_CLIENT_ID "${{ secrets.GOOGLE_WEB_CLIENT_ID }}"

          exit "$fail"

      # ✅ رفع APK كـ artifact
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
